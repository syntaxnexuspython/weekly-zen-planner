<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="zenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer glowing Zen Enso Ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#zenGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="132 12" filter="url(#glow)" />
  
  <!-- Center Petal -->
  <path d="M32 17 C37 24 37 32 32 43 C27 32 27 24 32 17 Z" fill="none" stroke="url(#zenGrad)" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Left Inner Petal -->
  <path d="M32 26 C23 25 19 32 23 38 C28 41 31 43 32 43 C31 38 31 32 32 26 Z" fill="none" stroke="url(#glowGrad)" stroke-width="1.8" />
  
  <!-- Right Inner Petal -->
  <path d="M32 26 C41 25 45 32 41 38 C36 41 33 43 32 43 C33 38 33 32 32 26 Z" fill="none" stroke="url(#glowGrad)" stroke-width="1.8" />
  
  <!-- Left Outer Petal -->
  <path d="M26 31 C17 33 15 40 21 44 C26 44 29 43.5 32 43 C28 41 26 36 26 31 Z" fill="none" stroke="url(#zenGrad)" stroke-width="1.5" />
  
  <!-- Right Outer Petal -->
  <path d="M38 31 C47 33 49 40 43 44 C38 44 35 43.5 32 43 C36 41 38 36 38 31 Z" fill="none" stroke="url(#zenGrad)" stroke-width="1.5" />
  
  <!-- Center Core Star / Diamond -->
  <path d="M32 29 L34 32 L32 35 L30 32 Z" fill="url(#zenGrad)" />
</svg>
